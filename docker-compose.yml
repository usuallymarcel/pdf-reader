
services:
  pdf-reader:
    build: .
    container_name: pdf-reader
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      DATA_DIR: /data
      MAX_UPLOAD_MB: "500"
    volumes:
      - pdf_reader_data:/data
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.pdf-reader.rule=Host(`reader.marcel.co.nz`)"
      - "traefik.http.routers.pdf-reader.entrypoints=websecure"
      - "traefik.http.routers.pdf-reader.tls=true"
      - "traefik.http.routers.pdf-reader.tls.certresolver=myresolver"

      - "traefik.http.services.pdf-reader.loadbalancer.server.port=8000"

    networks:
      - proxy

volumes:
  pdf_reader_data:

networks:
  proxy:
    external: true
